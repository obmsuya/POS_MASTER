name: Release FALTASI CLI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install goversioninfo (embeds the Windows icon)
        run: go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest

      - name: Generate Windows resource (icon + version info)
        working-directory: cmd/faltasi
        run: goversioninfo -platform-specific=true versioninfo.json

      - name: Build binaries
        run: |
          mkdir -p dist

          build() {
            os=$1
            arch=$2
            ext=$3
            out="dist/faltasi-${os}-${arch}${ext}"
            echo "Building $out"
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" -o "$out" ./cmd/faltasi
          }

          build windows amd64 .exe
          build darwin  amd64 ""
          build darwin  arm64 ""
          build linux   amd64 ""

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "FALTASI CLI ${{ github.ref_name }}"
          body: "See the assets below for downloads. Pick the file matching your OS."
          draft: false
          prerelease: false
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
